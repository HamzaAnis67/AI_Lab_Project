services:
  - type: web
    name: customer-churn-detection
    env: python
    pythonVersion: "3.11"  # Specify stable Python version
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend:app
    envVars:
      - key: PORT
        value: 10000
    plan: free
